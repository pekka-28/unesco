name: Supabase reporting checks
on:
  pull_request:
  push:
    paths:
      - 'site/**'
      - 'site-supabase/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/monthly_usage_report.mjs'
      - '.github/workflows/supabase-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm install --prefix .local --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - run: node --test tests/*.test.mjs
