name: Supabase database probe
on:
  schedule:
    - cron: '17 2,10,19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supabase-probe.yml'
      - 'scripts/probe_supabase.ts'
      - 'scripts/probe_delay.ts'
      - 'tests/supabase-probe.test.ts'
      - 'supabase/functions/_shared/contracts.ts'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: supabase-database-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.MWH_SUPABASE_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate probe behaviour without network access
        run: node --import tsx --test tests/supabase-probe.test.ts
      - name: Randomize scheduled probe time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay=$(node --import tsx scripts/probe_delay.ts)
          echo "Waiting ${delay} seconds before the database read."
          sleep "$delay"
      - name: Run read-only database query
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node --import tsx scripts/probe_supabase.ts
